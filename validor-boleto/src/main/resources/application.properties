spring.application.name=validor-boleto

server.servlet.context-path=/api
server.port=8383
#server.port=${random.int(8383,9090)}

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:validador-boleto
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update

springdoc.swagger-ui.path=/documentation


spring.kafka.bootstrapServers=localhost:19092
spring.kafka.properties.schema.registry.url=http://localhost:8081
spring.kafka.properties.specific.avro.reader=true

spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

#Recebe apenas as ultimas mensagens das partições
#spring.kafka.consumer.auto-offset-reset=latest

#Configurações para consumer (Consumidor)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

#Configuração para producer (Produtor)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

spring.kafka.consumer.group-id=validador-boleto
spring.kafka.topico-boleto=solicitacao-boleto
spring.kafka.topico-notificacao=notificacao-boleto